name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Test
        run: go test -race ./...

      - name: Install clipboard integration dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libei-dev sway wl-clipboard xclip xsel xvfb

      - name: Test optional native Wayland capture build
        run: go test -race -tags wayland_portal ./...

      - name: Test X11 clipboard
        run: ./scripts/test-x11-clipboard.sh

      - name: Test native Wayland clipboard
        run: |
          ./scripts/test-wayland-clipboard.sh

      - name: Vet
        run: go vet ./...

      # Releases build linux/arm64, but nothing else does, so an arch-specific
      # break surfaces only after tagging. The evdev grab path uses raw
      # syscall numbers, which is exactly the shape that breaks per-arch.
      - name: Cross compile
        run: GOOS=linux GOARCH=arm64 go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
