name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      # Releases build linux/arm64, but nothing else does, so an arch-specific
      # break surfaces only after tagging. The evdev grab path uses raw
      # syscall numbers, which is exactly the shape that breaks per-arch.
      - name: Cross compile
        run: GOOS=linux GOARCH=arm64 go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
